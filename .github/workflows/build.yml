name: Build and smoke test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: coding-agent/package-lock.json
      - name: Install and verify pi coding runtime without external models
        run: npm ci --ignore-scripts && npm test
        working-directory: coding-agent
      - run: mvn -B -ntp -f yangbin-image-search-mcp-server/pom.xml -DskipTests package
      - name: Install Chinese font for presentation export
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: mvn -B -ntp "-Dtest.presentation.font=Noto Sans CJK SC" -Dtest=DeploymentSmokeTest,EnabledFeaturesTest,TerminalOperationToolUnitTest,InternalApiTokenFilterUnitTest,WorkspaceValidationTest,KnowledgeDocumentsTest,TenantToolTest,PersistentMemoryTest,PlanningEvidenceTest,MultilingualPdfTest,TaskWorkflowTest,TaskWorkflowIntegrationTest,SkillServiceTest,TaskPlanningServiceTest,TaskConfirmationTest,PlanQualityServiceTest,PlanRepairServiceTest,ExecutionProvenanceTest,FrozenDatasetEvaluationTest,SourceClaimReviewTest,PlanRouteServiceTest,WorkServiceTest,WorkPresentationTest,PartnerChatServiceTest,PartnerWorkspaceTest,PartnerCapabilitiesTest,CodingServiceTest,CodingAgentEndToEndTest,ModelProfileServiceTest,PrivateModelProtocolTest,CodingModelSelectionTest,ModelProfilesHttpEndToEndTest,KeylessStartupTest,MissingDashScopeKeyEnvironmentPostProcessorTest package
      - name: Preserve source-rule evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-rule-evaluation
          path: target/quality-evaluation.json
          if-no-files-found: warn
      - name: Render frozen offline evaluation
        if: always()
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools/evaluation")
          from dataset_contract import read
          from offline_report import DEFAULT_LABELS, build_report, write_outputs
          for path in Path("target/evaluation").glob("*/observations.json"):
              write_outputs(build_report(read(path), read(DEFAULT_LABELS)), path.parent / "report")
          PY
      - name: Render assisted-human source review comparison
        if: always()
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools/evaluation")
          from dataset_contract import read
          from source_review_report import compare, write, CONFIRMATION
          if not CONFIRMATION.exists():
              print("Private confirmation not bundled; no human-confirmed report is claimed.")
              raise SystemExit(0)
          external = sorted(Path("target/source-review").glob("*/external-applicability.json"))
          for observed in Path("target/evaluation").glob("*/observations.json"):
              if external:
                  write(compare(read(observed), read(external[-1])), observed.parent / "source-review")
          PY
      - name: Preserve external applicability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-review-external-applicability
          path: target/source-review/
          if-no-files-found: warn
      - name: Preserve frozen evaluation inputs, failures and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-offline-evaluation
          path: target/evaluation/
          if-no-files-found: warn
      - run: python -m pip install -r deploy/turing/requirements.txt
      - run: python -m unittest discover -s deploy/turing -p "test_*.py"
      - name: Verify read-only evaluation record contract
        run: python -m unittest discover -s tools/evaluation -p "test_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: yangbin-ai-agent-frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: yangbin-ai-agent-frontend
      - name: Install browser for model-profile UI contract tests
        run: npx playwright install --with-deps chromium
        working-directory: yangbin-ai-agent-frontend
      - name: Verify model settings and chat/work selection
        run: npm run test:models-ui
        working-directory: yangbin-ai-agent-frontend
      - name: Preserve model UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-profile-ui
          path: yangbin-ai-agent-frontend/tmp/model-profiles-ui/
          if-no-files-found: warn

      - name: Verify all partner toolkits, model selection and resource workflows
        run: node tests/partners.browser.mjs
        working-directory: yangbin-ai-agent-frontend
      - name: Preserve partner UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-capabilities-ui
          path: yangbin-ai-agent-frontend/tmp/partners-ui/
          if-no-files-found: warn
