spring:
  mvc:
    async:
      request-timeout: 300000
  ai:
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}
        name: yangbin-ai-agent
        type: SYNC
        request-timeout: 30s
        sse:
          connections:
            knowledge:
              url: ${MCP_URL:http://127.0.0.1:18127}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
server:
  error:
    include-message: never
    include-stacktrace: never
logging:
  file:
    name: logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

app:
  planning:
    live-enabled: ${PLANNING_LIVE_ENABLED:false}
