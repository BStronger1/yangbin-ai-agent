spring:
  application:
    name: yangbin-ai-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
# 临时注释掉，便于大家开发调试和部署（实际填写 PgVector 数据库信息）
#  datasource:
#    url: xxx
#    username: root
#    password: 123456
  ai:
    dashscope:
      # 需要替换为你自己的 key
      api-key: ${DASHSCOPE_API_KEY:development-placeholder}
      chat:
        options:
          model: qwen-plus
    ollama:
      init:
        pull-model-strategy: never
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b
# 临时注释掉，便于大家开发调试和部署（实际需要启动 MCP 服务）
#    mcp:
#      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
# 临时注释掉，便于大家开发调试和部署（实际需要启动 PgVector 数据库）
#    vectorstore:
#      pgvector:
#        index-type: HNSW
#        dimensions: 1536
#        distance-type: COSINE_DISTANCE
#        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
server:
  port: ${SERVER_PORT:8123}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    context-path: /api
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yangbin.yangbinaiagent.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI
search-api:
  # 需要替换为你自己的 key
  api-key: ${SEARCH_API_KEY:}
# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: INFO
app:
  internal-api-token: ${INTERNAL_API_TOKEN:}
  model:
    provider: ${MODEL_PROVIDER:dashscope}
    base-url: ${MODEL_BASE_URL:https://api.openai.com}
    api-key: ${MODEL_API_KEY:}
    name: ${MODEL_NAME:gpt-4.1-mini}
  rag:
    enabled: ${RAG_ENABLED:false}
    cloud-enabled: ${RAG_CLOUD_ENABLED:false}
    embedding-base-url: ${EMBEDDING_BASE_URL:http://127.0.0.1:18128}
    embedding-api-key: ${EMBEDDING_API_KEY:local}
    embedding-model: ${EMBEDDING_MODEL:sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    index-dir: ${RAG_INDEX_DIR:tmp/rag}
  tools:
    extended-enabled: ${EXTENDED_TOOLS_ENABLED:false}
    terminal-enabled: ${TERMINAL_ENABLED:false}
